[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fastgrpc3-transport"
version = "0.1.0"
description = "A tonic gRPC server transport for fastgrpc3, with handlers written in Python"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"

[project.urls]
Repository = "https://github.com/EdwinAlkins/fastgrpc3-transport"

[tool.maturin]
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
