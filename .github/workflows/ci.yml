name: CI

# Rust: format (rustfmt defaults), clippy with every feature set, cargo test. Python: the
# extension on Linux and Python 3.14, with fastgrpc3's suite on tonic and the bridge tests.
# Every platform and Python, with PGO: release.yml (on a tag, or by hand).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # src/python.rs only compiles with the `python` feature; variant A with `variant-a`.
      - name: Clippy (python)
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Clippy (variant-a)
        run: cargo clippy --all-targets --features variant-a -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EdwinAlkins/fastgrpc3
          path: fastgrpc3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the extension
        run: |
          python -m pip install maturin pytest pytest-asyncio uvicorn ./fastgrpc3
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist fastgrpc3-transport
      - name: fastgrpc3's suite on tonic
        working-directory: fastgrpc3
        run: python -m pytest -k tonic
      - name: Bridge tests
        run: python -m pytest tests/python

