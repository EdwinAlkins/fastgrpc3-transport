name: CI

# Rust: format (rustfmt defaults), clippy with every feature set, cargo test. The wheels
# and the Python tests, on every platform, are in release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # src/python.rs only compiles with the `python` feature; variant A with `variant-a`.
      - name: Clippy (python)
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Clippy (variant-a)
        run: cargo clippy --all-targets --features variant-a -- -D warnings
      - name: Tests
        run: cargo test --all-targets

