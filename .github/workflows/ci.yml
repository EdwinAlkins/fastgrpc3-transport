name: CI

# Rust: format (rustfmt defaults), clippy with every feature set, cargo test.
# Python: build the extension with maturin and run the bridge tests (tests/python).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # src/python.rs only compiles with the `python` feature; variant A with `variant-a`.
      - name: Clippy (python)
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Clippy (variant-a)
        run: cargo clippy --all-targets --features variant-a -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the extension
        run: |
          python -m pip install maturin pytest pytest-asyncio "grpcio>=1.75.1"
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist fastgrpc3-transport
      - name: Bridge tests
        run: python -m pytest
