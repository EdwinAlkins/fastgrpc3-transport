[package]
name = "fastgrpc3-transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EdwinAlkins/fastgrpc3-transport"
publish = false
description = "A tonic gRPC server transport for fastgrpc3, with handlers written in Python"

[lib]
name = "fastgrpc3_transport"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1.12"
http = "1.5"
http-body = "1"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "server", "router", "codegen", "gzip", "deflate", "tls-ring"] }
x509-parser = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
socket2 = { version = "0.6", features = ["all"] }
tower = { version = "0.5", features = ["util"] }
tokio-stream = { version = "0.1", features = ["net"] }
pyo3 = { version = "0.30", optional = true }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"], optional = true }
# The version tonic routes with (`Routes` wraps an axum `Router`).
axum = { version = "0.8", default-features = false }

[features]
python = ["dep:pyo3", "pyo3/extension-module", "dep:x509-parser", "dep:base64"]
# Variant A of the spike (one asyncio wake-up per call), kept for benchmarks only.
variant-a = ["python", "dep:pyo3-async-runtimes"]

[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "codegen"] }
